server {
    listen 80;
    listen [::]:80;
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Support Flutter's HTML5 routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check for Dokploy/Traefik
    location /health {
        access_log off;
        return 200 'OK';
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
