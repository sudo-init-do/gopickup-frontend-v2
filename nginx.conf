server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Support Flutter's URL strategy (HTML5 routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend container
    location /api/v1/ {
        # Using a variable for the upstream host prevents Nginx from failing at startup 
        # if the 'backend' hostname is not resolvable at that exact moment.
        resolver 127.0.0.11 valid=30s;
        set $backend_host "backend";
        
        proxy_pass http://$backend_host:8080/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket requests
    location /api/v1/socket {
        resolver 127.0.0.11 valid=30s;
        set $backend_host "backend";

        proxy_pass http://$backend_host:8080/api/v1/socket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
