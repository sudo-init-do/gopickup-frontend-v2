server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Support Flutter's URL strategy (HTML5 routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Debug path to verify Nginx is healthy
    location /frontend-health {
        return 200 'Nginx is alive';
    }

    # Proxy API requests to the backend container
    location /api/ {
        # Standard Docker DNS resolver
        resolver 127.0.0.11 valid=5s;
        set $backend_api "gopickup-api";

        proxy_pass http://$backend_api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $backend_api;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
