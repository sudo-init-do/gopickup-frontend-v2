server {
    listen 80;
    listen [::]:80;
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Support Flutter's HTML5 routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy to bypass CORS
    location /api/ {
        # DNS resolver (needed for dynamic domain resolution in Docker)
        resolver 8.8.8.8 valid=30s;
        set $backend_url https://backend.gopickup.com.ng/api/;

        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host backend.gopickup.com.ng;
        proxy_cache_bypass $http_upgrade;
        
        # SSL Handshake settings (Critical for talking to secure backends)
        proxy_ssl_server_name on;
        proxy_ssl_name backend.gopickup.com.ng;
        proxy_ssl_session_reuse off;

        # Security headers for the proxy
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT' always;
        add_header 'Access-Control-Allow-Headers' 'X-Requested-With,Content-Type,Authorization' always;
    }

    # Internal health check for Docker/Traefik
    location /health {
        access_log off;
        return 200 'OK';
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
