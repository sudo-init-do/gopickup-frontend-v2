server {
    listen 80;
    listen [::]:80;
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Support Flutter's HTML5 routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy to bypass CORS - V3 (Hardened)
    location /api/v1/ {
        resolver 8.8.8.8 valid=30s;
        
        proxy_pass https://backend.gopickup.com.ng/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host backend.gopickup.com.ng;
        proxy_cache_bypass $http_upgrade;
        
        # Absolute SSL Compatibility
        proxy_ssl_server_name on;
        proxy_ssl_name backend.gopickup.com.ng;
        proxy_ssl_verify off; # Needed if backend certs are Docker-internal
        proxy_ssl_session_reuse on;

        # Increased buffers for larger payloads (like registration/images)
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;

        # Header adjustments
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Security headers for the proxy
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT' always;
        add_header 'Access-Control-Allow-Headers' 'X-Requested-With,Content-Type,Authorization' always;
    }

    # Internal health check for Docker/Traefik
    location /health {
        access_log off;
        return 200 'OK';
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
