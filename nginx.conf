server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Support Flutter's URL strategy (HTML5 routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend container
    location /api/ {
        # Standard Docker DNS resolver
        resolver 127.0.0.11 valid=30s;
        set $backend_service "backend";
        
        # Passing the URI explicitly to ensure /api/v1/orders works correctly
        proxy_pass http://$backend_service:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase timeouts for slower DB startups
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
