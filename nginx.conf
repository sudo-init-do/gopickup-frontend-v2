server {
    listen 80;
    listen [::]:80;
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Support Flutter's HTML5 routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry point, service worker, or version manifest.
    # These gate every other asset, so they must always be revalidated or a
    # new deploy keeps serving the old cached app until a manual cache wipe.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # main.dart.js is not content-hashed, so it must be revalidated too.
    location = /main.dart.js {
        add_header Cache-Control "no-cache, must-revalidate";
        expires off;
    }

    # Hashed/static assets (canvaskit, fonts, images) are safe to cache long.
    location ~* \.(?:css|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Health check for Dokploy/Traefik
    location /health {
        access_log off;
        return 200 'OK';
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
