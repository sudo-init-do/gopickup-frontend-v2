server {
    listen 3030;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Support Flutter's URL strategy (HTML5 routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Expose port 3030 for the final restoration
    # Heartbeat endpoints for Dokploy/Traefik health checks
    location /health {
        return 200 'OK';
    }
    location /healthz {
        return 200 'OK';
    }

    # Debug path to verify Nginx is healthy
    location /frontend-health {
        return 200 'Nginx is alive';
    }


    error_log stderr debug;
    access_log /dev/stdout;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
