server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Support Flutter's URL strategy (HTML5 routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Debug path to verify Nginx is healthy
    location /frontend-health {
        return 200 'Nginx is alive';
    }


    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
