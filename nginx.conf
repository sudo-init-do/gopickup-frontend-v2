server {
    listen 80;
    listen [::]:80;
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Support Flutter's HTML5 routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy to bypass CORS - V4 (Fail-Safe)
    location /api/v1/ {
        proxy_pass https://backend.gopickup.com.ng/api/v1/;
        
        # Identity Headers (Important for backend trust)
        proxy_set_header Host backend.gopickup.com.ng;
        proxy_set_header Origin https://main.gopickup.com.ng;
        proxy_set_header Referer https://main.gopickup.com.ng/;
        
        # Connection settings
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        
        # SSL Pass-through settings
        proxy_ssl_server_name on;
        proxy_ssl_name backend.gopickup.com.ng;
        proxy_ssl_verify off; 
        
        # Stability: Disable buffering for APIs to prevent 502 on large replies
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;

        # Add CORS headers directly for the response
        add_header 'Access-Control-Allow-Origin' 'https://main.gopickup.com.ng' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT' always;
        add_header 'Access-Control-Allow-Headers' 'X-Requested-With,Content-Type,Authorization' always;
    }

    # Internal health check for Docker/Traefik
    location /health {
        access_log off;
        return 200 'OK';
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
