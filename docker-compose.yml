version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gopickup-frontend.rule=Host(`main.gopickup.com.ng`)"
      - "traefik.http.services.gopickup-frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.gopickup-frontend.entrypoints=websecure"
      - "traefik.http.routers.gopickup-frontend.tls.certresolver=letsencrypt"
      - "traefik.docker.network=dokploy-network"

networks:
  dokploy-network:
    external: true
